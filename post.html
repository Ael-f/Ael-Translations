<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Membaca Bab - Ael Translations</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .chapter-content {
      line-height: 1.8;
      font-size: 1.05rem;
      margin-top: 20px;
      margin-bottom: 40px;
      white-space: pre-line;
    }
    .nav-buttons {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 30px;
      gap: 10px;
      flex-wrap: wrap;
    }
    .nav-btn, .back-link {
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 5px;
      text-decoration: none;
      color: inherit;
      transition: background 0.2s;
    }
    .nav-btn:hover, .back-link:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .nav-btn.disabled {
      opacity: 0.3;
      pointer-events: none;
    }
    .center-nav {
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <header>
    <a href="/" class="logo">Ael Translations</a>
  </header>

  <main>
    <article>
      <!-- Judul Bab -->
      <h1 id="chapter-title">Memuat Judul Bab...</h1>
      <hr>

      <!-- Tempat Isi Cerita -->
      <div id="chapter-body" class="chapter-content">
        <p>Memuat isi cerita...</p>
      </div>

      <hr>

      <!-- Navigasi Previous & Next -->
      <div class="nav-buttons" id="nav-container">
        <!-- Akan diisi otomatis oleh JavaScript -->
      </div>

      <!-- Tombol Kembali ke Daftar Bab -->
      <div class="center-nav">
        <a href="" id="toc-link" class="back-link">&larr; Kembali ke Daftar Bab</a>
      </div>
      
    </article>
  </main>

  <script>
    // Cek warna dari memori dan pasang otomatis supaya sama dengan beranda
    const warnaTersimpan = localStorage.getItem('warnaAel');
    if (warnaTersimpan) {
      document.body.className = warnaTersimpan;
    }

    const username = 'Ael-f';
    const repo = 'Ael-Translations';
    
    const urlParams = new URLSearchParams(window.location.search);
    const postId = urlParams.get('id');

    async function loadChapterContent() {
      if (!postId) {
        document.getElementById('chapter-title').innerText = 'Bab tidak ditemukan';
        return;
      }

      try {
        // 1. Ambil semua file bab di folder post untuk urutan Prev/Next & Novel terkait
        const listRes = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/post`);
        const files = await listRes.json();
        const markdownFiles = files.filter(f => f.name.endsWith('.md')).sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true}));

        let currentIndex = -1;
        let fileNames = markdownFiles.map(f => f.name.replace('.md', ''));
        currentIndex = fileNames.indexOf(postId);

        // 2. Ambil isi bab saat ini
        const res = await fetch(`https://raw.githubusercontent.com/${username}/${repo}/main/post/${postId}.md`);
        const rawText = await res.text();
        const parts = rawText.split('---');
        let bodyText = rawText;
        let title = postId.replace(/-/g, ' ');
        let novelName = '';

        if (parts.length >= 3) {
          const frontmatter = parts[1];
          bodyText = parts.slice(2).join('---').trim();

          const titleMatch = frontmatter.match(/title:\s*["']?(.*?)["']?\n/);
          if (titleMatch) title = titleMatch[1];

          const novelMatch = frontmatter.match(/novel:\s*["']?(.*?)["']?\n/);
          if (novelMatch) novelName = novelMatch[1];
        }

        document.title = `${title} - Ael Translations`;
        document.getElementById('chapter-title').innerText = title;
        document.getElementById('chapter-body').innerText = bodyText;

        // Set tombol kembali ke halaman novel yang sesuai dengan slug yang akurat
        if (novelName) {
          const novelId = novelName
            .toLowerCase()
            .trim()
            .replace(/[^\w\s-]/g, '')
            .replace(/[\s_-]+/g, '-')
            .replace(/^-+|-+$/g, '');
            
          document.getElementById('toc-link').href = `novel.html?id=${novelId}`;
        } else {
          document.getElementById('toc-link').href = '/';
        }

        // 3. Render Tombol Previous & Next
        const prevId = currentIndex > 0 ? fileNames[currentIndex - 1] : null;
        const nextId = currentIndex < fileNames.length - 1 ? fileNames[currentIndex + 1] : null;

        const navContainer = document.getElementById('nav-container');
        navContainer.innerHTML = `
          <a href="post.html?id=${prevId}" class="nav-btn ${prevId ? '' : 'disabled'}">&larr; Sebelumnya</a>
          <a href="post.html?id=${nextId}" class="nav-btn ${nextId ? '' : 'disabled'}">Selanjutnya &rarr;</a>
        `;

      } catch (err) {
        document.getElementById('chapter-title').innerText = 'Gagal memuat bab';
        document.getElementById('chapter-body').innerHTML = '<p>Terjadi kesalahan atau bab ini belum ada.</p>';
      }
    }

    loadChapterContent();
  </script>
</body>
</html>

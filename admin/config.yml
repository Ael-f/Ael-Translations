backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

# Memasang CSS kustom agar tampilan admin berubah minimalis ala Notion
css_files:
  - "/admin/custom.css"

collections:
  - name: "novel"
    label: "Daftar Novel"
    folder: "content/novel"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Judul Novel", name: "title", widget: "string" }
      - { label: "Cover Novel", name: "cover", widget: "image" }
      - { label: "Penulis Asli", name: "author", widget: "string" }
      - { label: "Sinopsis", name: "synopsis", widget: "text" }

  - name: "posts"
    label: "Chapter"
    folder: "post"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Judul Bab", name: "title", widget: "string" }
      
      # Pilihan novel otomatis berupa dropdown (tinggal klik)
      - label: "Pilih Novel"
        name: "novel"
        widget: "relation"
        collection: "novel"
        search_fields: ["title"]
        value_field: "title"
        display_fields: ["title"]
        hint: "Pilih dari daftar novel yang sudah dibuat"

      - { label: "Isi Terjemahan Bab", name: "body", widget: "markdown" }